<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLMGarage</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="paper">
      <header class="masthead">
        <div class="edition-line">
          <span>&#x672c;&#x5730;&#x7248;</span>
          <span id="appUrl">127.0.0.1:58001</span>
          <span>local LLM garage</span>
        </div>
        <div class="nameplate">
          <div>
            <p class="kicker">LOCAL LLM GARAGE</p>
            <h1>LLMGarage</h1>
          </div>
          <div class="status-box">
            <span id="runState" class="status idle">Stopped</span>
            <span id="pidText">PID -</span>
            <span id="uptimeText">00:00:00</span>
          </div>
        </div>
      </header>

      <section id="toast" class="notice" hidden></section>

      <section class="front-page" aria-label="LLMGarage">
        <aside class="column preset-column">
          <div class="section-title">
            <span>&#x9884;&#x8bbe;&#x7d22;&#x5f15;</span>
            <button id="newPresetBtn">&#x65b0;&#x5efa;</button>
          </div>
          <label class="field compact">
            <span>&#x5f53;&#x524d;&#x9884;&#x8bbe;</span>
            <select id="presetSelect"></select>
          </label>
          <div id="presetList" class="preset-list"></div>

          <div class="rule"></div>
          <label class="field">
            <span>&#x9884;&#x8bbe;&#x540d;&#x79f0;</span>
            <input id="presetName" autocomplete="off" />
          </label>
          <div class="button-row stacked">
            <button id="savePresetBtn" class="primary">&#x4fdd;&#x5b58;&#x9884;&#x8bbe;</button>
            <button id="duplicatePresetBtn">&#x590d;&#x5236;</button>
            <button id="deletePresetBtn" class="danger">&#x5220;&#x9664;</button>
          </div>
          <p id="dirtyBadge" class="stamp" hidden>&#x672a;&#x4fdd;&#x5b58;</p>
        </aside>

        <section class="column config-column">
          <div class="section-title"><span>&#x914d;&#x7f6e;&#x7248;&#x9762;</span></div>
          <div class="subhead">&#x8def;&#x5f84;</div>
          <label class="field wide">
            <span>llama-server.exe</span>
            <input id="serverPath" placeholder="D:\llama.cpp\build\bin\Release\llama-server.exe" />
          </label>
          <label class="field wide">
            <span>GGUF &#x6a21;&#x578b;</span>
            <input id="modelPath" placeholder="D:\models\model.gguf" />
          </label>

          <div class="subhead">&#x670d;&#x52a1;&#x53c2;&#x6570;</div>
          <div class="form-grid">
            <label class="field"><span>Host</span><input id="host" /></label>
            <label class="field"><span>Port</span><input id="port" type="number" min="1" max="65535" /></label>
            <label class="field"><span>Context</span><input id="ctxSize" type="number" min="0" /></label>
            <label class="field auto-field">
              <span class="label-row">GPU Layers <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --gpu-layers&#x3002;&#x63a7;&#x5236;&#x5c06;&#x591a;&#x5c11;&#x5c42;&#x6a21;&#x578b;&#x5378;&#x8f7d;&#x5230; GPU&#x3002;&#x663e;&#x5b58;&#x8db3;&#x591f;&#x65f6;&#x53ef;&#x9002;&#x5f53;&#x8c03;&#x9ad8;&#xff1b;&#x663e;&#x5b58;&#x4e0d;&#x8db3;&#x6216;&#x4e0d;&#x786e;&#x5b9a;&#x65f6;&#x7528;&#x81ea;&#x52a8;&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="gpuLayers"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="gpuLayers" type="number" min="0" /></div>
              <div class="tip-panel" id="tip-gpuLayers" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">Threads <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --threads&#x3002;&#x63a7;&#x5236;&#x63a8;&#x7406;&#x4f7f;&#x7528;&#x7684; CPU &#x7ebf;&#x7a0b;&#x6570;&#x3002;&#x4e00;&#x822c;&#x4e0d;&#x786e;&#x5b9a;&#x65f6;&#x7528;&#x81ea;&#x52a8;&#xff1b;&#x624b;&#x52a8;&#x65f6;&#x53ef;&#x63a5;&#x8fd1;&#x7269;&#x7406;&#x6838;&#x5fc3;&#x6570;&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="threads"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="threads" type="number" min="0" /></div>
              <div class="tip-panel" id="tip-threads" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">Batch <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --batch-size&#x3002;&#x5f71;&#x54cd;&#x63d0;&#x793a;&#x8bcd;&#x5904;&#x7406;&#x548c;&#x9884;&#x586b;&#x5145;&#x6279;&#x91cf;&#x3002;&#x503c;&#x5927;&#x53ef;&#x80fd;&#x66f4;&#x5feb;&#x4f46;&#x66f4;&#x5360;&#x5185;&#x5b58;&#x6216;&#x663e;&#x5b58;&#xff1b;&#x4e0d;&#x786e;&#x5b9a;&#x65f6;&#x7528;&#x81ea;&#x52a8;&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="batchSize"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="batchSize" type="number" min="0" /></div>
              <div class="tip-panel" id="tip-batchSize" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">UBatch <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --ubatch-size&#x3002;&#x7269;&#x7406;&#x5fae;&#x6279;&#x91cf;&#xff0c;&#x7528;&#x4e8e;&#x63a7;&#x5236;&#x5b9e;&#x9645;&#x8ba1;&#x7b97;&#x5206;&#x5757;&#x3002;&#x503c;&#x8fc7;&#x5927;&#x53ef;&#x80fd;&#x5bfc;&#x81f4;&#x5185;&#x5b58;&#x538b;&#x529b;&#xff1b;&#x901a;&#x5e38;&#x7528;&#x81ea;&#x52a8;&#x6216;&#x4fdd;&#x6301;&#x5c0f;&#x4e8e;&#x7b49;&#x4e8e; Batch&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="ubatchSize"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="ubatchSize" type="number" min="0" /></div>
              <div class="tip-panel" id="tip-ubatchSize" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">Parallel <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --parallel&#x3002;&#x63a7;&#x5236;&#x5e76;&#x884c;&#x5904;&#x7406;&#x7684;&#x8bf7;&#x6c42;&#x6216; slot &#x6570;&#x3002;&#x503c;&#x5927;&#x53ef;&#x63d0;&#x9ad8;&#x5e76;&#x53d1;&#xff0c;&#x4f46;&#x4f1a;&#x5206;&#x5360;&#x4e0a;&#x4e0b;&#x6587;&#x548c;&#x5185;&#x5b58;&#xff1b;&#x5355;&#x4eba;&#x672c;&#x5730;&#x4f7f;&#x7528;&#x5efa;&#x8bae;&#x81ea;&#x52a8;&#x6216; 1&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="parallel"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="parallel" type="number" min="1" /></div>
              <div class="tip-panel" id="tip-parallel" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">Temperature <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --temp&#x3002;&#x63a7;&#x5236;&#x751f;&#x6210;&#x968f;&#x673a;&#x6027;&#x3002;&#x8d8a;&#x4f4e;&#x8d8a;&#x7a33;&#x5b9a;&#xff0c;&#x8d8a;&#x9ad8;&#x8d8a;&#x53d1;&#x6563;&#x3002;&#x60f3;&#x4f7f;&#x7528; llama.cpp &#x9ed8;&#x8ba4;&#x91c7;&#x6837;&#x65f6;&#x9009;&#x81ea;&#x52a8;&#xff1b;&#x5e38;&#x89c1;&#x624b;&#x52a8;&#x503c; 0.2-1.0&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="temperature"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="temperature" type="number" min="0" step="0.01" /></div>
              <div class="tip-panel" id="tip-temperature" hidden></div>
            </label>
            <label class="field auto-field">
              <span class="label-row">Top P <button class="tip" type="button" aria-expanded="false" aria-label="show parameter help" data-tip="&#x5bf9;&#x5e94; --top-p&#x3002;&#x6838;&#x91c7;&#x6837;&#x9608;&#x503c;&#xff0c;&#x9650;&#x5236;&#x5019;&#x9009; token &#x6982;&#x7387;&#x8d28;&#x91cf;&#x3002;&#x503c;&#x8d8a;&#x4f4e;&#x8d8a;&#x4fdd;&#x5b88;&#xff1b;&#x60f3;&#x4f7f;&#x7528; llama.cpp &#x9ed8;&#x8ba4;&#x503c;&#x65f6;&#x9009;&#x81ea;&#x52a8;&#xff0c;&#x5e38;&#x89c1;&#x624b;&#x52a8;&#x503c; 0.8-0.95&#x3002;">?</button></span>
              <div class="auto-control"><select class="auto-mode" data-target="topP"><option value="auto">&#x81ea;&#x52a8;</option><option value="manual">&#x624b;&#x52a8;</option></select><input id="topP" type="number" min="0" max="1" step="0.01" /></div>
              <div class="tip-panel" id="tip-topP" hidden></div>
            </label>
          </div>

          <div class="toggle-line">
            <label><input id="embedding" type="checkbox" /> Embedding</label>
            <label><input id="reranking" type="checkbox" /> Reranking</label>
          </div>

          <div class="subhead">&#x9ad8;&#x7ea7;&#x53c2;&#x6570;</div>
          <textarea id="advancedArgs" rows="4" placeholder='--chat-template chatml --alias "qwen local"'></textarea>
        </section>

        <aside class="column operations-column">
          <div class="section-title"><span>&#x8fd0;&#x884c;&#x7248;</span></div>
          <div class="button-row">
            <button id="validateBtn">&#x6821;&#x9a8c;</button>
            <button id="startBtn" class="primary">&#x542f;&#x52a8;</button>
            <button id="stopBtn">&#x505c;&#x6b62;&#x5f53;&#x524d;</button>
            <button id="killAllBtn" class="danger">&#x505c;&#x6b62;&#x5168;&#x90e8;</button>
          </div>
          <div id="validationBox" class="messages"></div>

          <div class="subhead">&#x542f;&#x52a8;&#x547d;&#x4ee4;</div>
          <pre id="commandPreview" class="command"></pre>

          <div class="section-title small"><span>API &#x8bd5;&#x9a8c;</span></div>
          <div class="button-row">
            <button id="healthBtn">&#x5065;&#x5eb7;&#x68c0;&#x67e5;</button>
            <button id="testPromptBtn" class="primary">&#x53d1;&#x9001; Prompt</button>
          </div>
          <textarea id="testPrompt" rows="4">Say hello in one short sentence.</textarea>
          <pre id="testResult" class="response"></pre>
        </aside>
      </section>

      <details class="log-fold">
        <summary>
          <span>&#x8fd0;&#x884c;&#x7eaa;&#x8981;</span>
          <button id="refreshLogsBtn" type="button">&#x5237;&#x65b0;</button>
        </summary>
        <pre id="logs" class="logs"></pre>
      </details>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
